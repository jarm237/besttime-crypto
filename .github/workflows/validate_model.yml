name: Validate model metrics

on:
  push:
    paths:
      - 'logs/**'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run evaluation
        run: |
          python scripts/eval_meta_model.py

      - name: Check metrics vs baseline
        run: |
          python scripts/check_metrics_threshold.py

      - name: Build label quality report (Phase 8)
        run: |
          if [ -f data/feature_store/training/ml_dataset_v3.parquet ]; then
            python scripts/build_label_quality_report.py \
              --fallback data/feature_store/training/ml_dataset_v3.parquet \
              --output data/feature_store/labels/label_quality_report.json
          else
            echo "Skipping label quality report build: fallback dataset not found"
          fi

      - name: Check label quality thresholds
        run: |
          if [ -f data/feature_store/labels/label_quality_report.json ]; then
            python scripts/check_label_quality_threshold.py \
              --report data/feature_store/labels/label_quality_report.json \
              --output logs/label_quality_threshold_check.json
          else
            echo "Skipping label quality threshold check: report not found"
          fi
