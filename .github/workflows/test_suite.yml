name: Test Suite CI Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline tests (non-network)
        run: |
          python -m pytest tests/ -m "not network" --tb=short -q --timeout=60 --junitxml=reports/junit-offline.xml

      - name: Run network tests
        if: always()
        continue-on-error: true
        run: |
          python -m pytest tests/ -m "network" --tb=short -q --timeout=120 --junitxml=reports/junit-network.xml

      - name: Upload offline test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-offline
          path: reports/junit-offline.xml

      - name: Upload network test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-network
          path: reports/junit-network.xml
